# What lydite builds, tests, scans and gates in vipengele/go.
#
# Each project under source/ is its own Go module (ADR-0001). A component is the
# unit its build tool treats as a whole, and here that unit is one module: each
# is a `go-test` component rooted at the module's directory, run with the race
# detector.
#
# A component that requires a sibling project's module resolves it at the
# released version its go.mod names, never through go.work (ADR-0002), so it
# needs no `setup` and no `depends_on` to build the sibling first.
#
# Every project under source/ has one component with `name` (the project), `dir` (its directory),
# `runner: go-test` and `args: ["-race", "./..."]`.
#
# tools/ holds repository tooling rather than projects (ADR-0004); each tool under it is a component
# of its own, run by the runner of its language. vanity-worker is a TypeScript Worker tested with
# vitest, and its coverage provider is a pinned devDependency of the tool.
components:
  - name: cli-core
    dir: source/cli/core
    runner: go-test
    args: ["-race", "./..."]
  - name: update
    dir: source/update
    runner: go-test
    args: ["-race", "./..."]
  - name: daemon
    dir: source/daemon
    runner: go-test
    args: ["-race", "./..."]
  - name: commons
    dir: source/commons
    runner: go-test
    args: ["-race", "./..."]
  - name: vanity-worker
    dir: tools/vanity-worker
    runner: vitest
