name = "vipengele-go-vanity"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [
  { pattern = "go.vipengele.org", custom_domain = true },
]

# The bucket publish-vanity-modules writes the module list object to: the value
# of the R2_BUCKET variable of the vanity-modules environment.
[[r2_buckets]]
binding = "MODULE_LIST"
bucket_name = "vipengele-go"
