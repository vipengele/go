version: "2"
linters:
  default: standard
  enable:
    - depguard
    - gochecknoglobals
  settings:
    depguard:
      rules:
        cobra-stays-in-internal-cobra:
          files:
            - "!**/internal/cobra/**"
          deny:
            - pkg: github.com/spf13/cobra
              desc: cobra stays inside internal/cobra (ADR-0005)
