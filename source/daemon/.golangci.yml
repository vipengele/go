version: "2"
linters:
  default: standard
  enable:
    - depguard
    - gochecknoglobals
  settings:
    depguard:
      rules:
        # A pkg entry matches by prefix; a glob such as "/**" is taken literally and matches nothing.
        no-cli:
          files:
            - "**"
          deny:
            - pkg: github.com/spf13/cobra
              desc: daemon does not depend on cobra
            - pkg: go.vipengele.org/cli/core
              desc: daemon does not depend on cli/core
        root-imports-only-the-instance-lock-siblings:
          files:
            - "!**/daemoncmd/**"
            - "!**/selfupdate/**"
          list-mode: lax
          allow:
            - go.vipengele.org/daemon$
            - go.vipengele.org/daemon/service$
            - go.vipengele.org/daemon/httpserver$
            - go.vipengele.org/daemon/systemd$
            - go.vipengele.org/cli/spec$
            - go.vipengele.org/cli/spec/paths$
            - go.vipengele.org/filelock$
            - go.vipengele.org/daemon/servicetest/internal/wire$
          deny:
            - pkg: go.vipengele.org/
              desc: outside daemoncmd, daemon imports only cli/spec, cli/spec/paths and filelock among its siblings
        selfupdate-imports-the-root-cli-state-update-and-version:
          files:
            - "**/selfupdate/**"
            - "!$test"
          list-mode: lax
          allow:
            - go.vipengele.org/daemon$
            - go.vipengele.org/daemon/service$
            - go.vipengele.org/daemon/httpserver$
            - go.vipengele.org/daemon/systemd$
            - go.vipengele.org/cli/spec$
            - go.vipengele.org/cli/spec/paths$
            - go.vipengele.org/cli/spec/version$
            - go.vipengele.org/filelock$
            - go.vipengele.org/cli/state$
            - go.vipengele.org/update$
          deny:
            - pkg: go.vipengele.org/
              desc: selfupdate imports only daemon, daemon/service, daemon/httpserver, daemon/systemd, cli/spec, cli/spec/paths, cli/spec/version, cli/state, filelock and update among its siblings
        selfupdate-tests-also-import-the-test-kits:
          files:
            - "**/selfupdate/**_test.go"
          list-mode: lax
          allow:
            - go.vipengele.org/daemon$
            - go.vipengele.org/daemon/service$
            - go.vipengele.org/daemon/httpserver$
            - go.vipengele.org/daemon/systemd$
            - go.vipengele.org/cli/spec$
            - go.vipengele.org/cli/spec/paths$
            - go.vipengele.org/cli/spec/version$
            - go.vipengele.org/filelock$
            - go.vipengele.org/cli/state$
            - go.vipengele.org/update$
            - go.vipengele.org/daemon/daemontest$
            - go.vipengele.org/update/updatetest$
          deny:
            - pkg: go.vipengele.org/
              desc: selfupdate's tests import only what selfupdate may, daemon/daemontest and update/updatetest
        daemoncmd-imports-the-root-service-selfupdate-and-update:
          files:
            - "**/daemoncmd/**"
            - "!$test"
          list-mode: lax
          allow:
            - go.vipengele.org/daemon$
            - go.vipengele.org/daemon/service$
            - go.vipengele.org/daemon/selfupdate$
            - go.vipengele.org/cli/spec$
            - go.vipengele.org/cli/spec/table$
            - go.vipengele.org/update$
            - go.vipengele.org/update/updatecmd$
          deny:
            - pkg: go.vipengele.org/
              desc: daemoncmd imports only daemon, daemon/service, daemon/selfupdate, cli/spec, cli/spec/table, update and update/updatecmd among its siblings
        daemoncmd-tests-also-import-the-test-kits:
          files:
            - "**/daemoncmd/**_test.go"
          list-mode: lax
          allow:
            - go.vipengele.org/daemon$
            - go.vipengele.org/daemon/service$
            - go.vipengele.org/daemon/selfupdate$
            - go.vipengele.org/cli/spec$
            - go.vipengele.org/cli/spec/table$
            - go.vipengele.org/update$
            - go.vipengele.org/update/updatecmd$
            - go.vipengele.org/daemon/daemoncmd$
            - go.vipengele.org/daemon/daemontest$
            - go.vipengele.org/cli/spec/speccheck$
            - go.vipengele.org/update/updatetest$
          deny:
            - pkg: go.vipengele.org/
              desc: daemoncmd's tests import only what daemoncmd may, daemoncmd itself, daemon/daemontest, cli/spec/speccheck and update/updatetest
