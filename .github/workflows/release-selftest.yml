# release-selftest — the self-test of the release scripts and workflows.
#
# `scripts` runs .github/scripts/release/test/run.sh, which builds each case's
# repository, bare `origin` and stub Worker in a temporary directory and runs
# one release script against it. It is offline: no fetch from GitHub, no module
# proxy, no toolchain download, so it is quick and cannot flake on the network.
# `actionlint` checks the release workflows and this one.
#
# It runs on every pull request and every push to main that touches the release
# scripts or workflows. They belong to no project under source/, so no project's
# build or test stage runs them, and a broken release script is otherwise only
# found by the release it breaks. It is a path-triggered check, not a stage of
# ci-orchestration.yml: gt renders that file from .gt-repo.yaml, so a stage
# there is a .gt-repo.yaml change. A failure shows on the pull request but does
# not block its merge: a pull request outside these paths never reports the
# check, so branch protection cannot require it.
name: release-selftest

on:
  pull_request:
    paths:
      - '.github/scripts/release/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/auto-release.yml'
      - '.github/workflows/release-selftest.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/release/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/auto-release.yml'
      - '.github/workflows/release-selftest.yml'

permissions: {}

# A newer push to the same pull request supersedes the run in flight; each
# push to main runs in a group of its own.
concurrency:
  group: release-selftest-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # run.sh sets GOTOOLCHAIN=local and gives each fixture project the
      # running toolchain's version, so any patched Go runs it; go.work names
      # the version local development uses.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      # bash, git, jq, python3, curl and the C toolchain `go test -race` needs
      # are all on the ubuntu-latest image.
      - name: run.sh
        run: bash .github/scripts/release/test/run.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release asset of rhysd/actionlint, checked against a pinned digest,
      # the one the release's own checksums file lists. It needs no Go
      # toolchain, and the same bytes run on every runner image. actionlint
      # runs shellcheck over each `run:` script, and the ubuntu-latest image
      # carries shellcheck on PATH.
      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p actionlint-bin
          tar -xzf "$archive" -C actionlint-bin actionlint
          echo "${RUNNER_TEMP}/actionlint-bin" >> "$GITHUB_PATH"

      # Each listed file that exists is checked, and one that does not is
      # reported and skipped. An empty selection fails rather than passing on
      # nothing checked.
      - name: actionlint
        run: |
          set -euo pipefail
          command -v shellcheck
          files=()
          for f in \
            .github/workflows/release.yml \
            .github/workflows/auto-release.yml \
            .github/workflows/release-selftest.yml; do
            if [[ -f "$f" ]]; then
              files+=("$f")
            else
              echo "skipping ${f}: not present"
            fi
          done
          if (( ${#files[@]} == 0 )); then
            echo "::error::none of the release workflows is present"
            exit 1
          fi
          actionlint -color "${files[@]}"
