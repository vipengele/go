# release — releases one project's version, or finishes a partial release.
#
# A release is the merge of its notes (ADR-0037): `auto-release.yml` calls this
# workflow for every pending project, and nothing else releases one. There is
# no tag trigger. A tag pushed with GITHUB_TOKEN starts no workflow (ADR-0016),
# so a tag this workflow pushes could not start the next step, and a tag pushed
# by hand releases nothing. The tag `source/<project>/vX.Y.Z` is the
# publication: the Go module proxy serves a module from the tag itself, so
# there is no registry to upload to and no credential in this repository.
#
# Two modes. `release` validates the commit `sha`, tests the project there,
# pushes the tag on it and announces it. `finish` takes a tag that already
# exists and announces it, which completes a release whose announcement failed;
# `auto-release.yml` calls it for every tag left unannounced, and a
# `workflow_dispatch` naming the tag does the same by hand. `dry_run` runs
# `verify` alone.
#
# Three jobs, and the seams between them are safety properties. `verify` holds
# a read-only token, checks out without persisting it, and is the only job that
# runs project code: it validates the release and runs the project's suite as
# a consumer of the tag would build it. `tag` and `announce` hold
# `contents: write` and run no project code: they check out only this
# workflow's own scripts, and `announce` runs `go list -m` against the module
# proxy, which builds nothing. Everything that can fail without leaving a
# version half-released fails in `verify`, before any job can write.
#
# The steps themselves live in .github/scripts/release/release-project.sh, and
# every job runs them from this workflow's commit, `github.sha`, never from the
# commit being released: a tag on a commit that predates the scripts is
# finished by them all the same.
name: release

on:
  workflow_call:
    inputs:
      project:
        description: The project, its directory relative to source/ (`cli/core`).
        type: string
        required: true
      version:
        description: The version to release, vX.Y.Z.
        type: string
        required: true
      sha:
        description: The commit to tag, on main. Required in mode `release`.
        type: string
        required: false
        default: ""
      mode:
        description: "`release` tags and announces sha; `finish` announces the existing tag."
        type: string
        required: true
      dry_run:
        description: Run verify alone, writing nothing.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag whose release to finish, source/<project>/vX.Y.Z.
        type: string
        required: true
      dry_run:
        description: Run verify alone, writing nothing.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One run per tag, and never cancel one in flight: a cancelled run can leave a
# version tagged but unannounced. Keyed by the tag, so a dispatched finish and
# a sweep never announce one tag at once. In a called workflow `github.*` names
# the caller, so the group is built from the inputs.
concurrency:
  group: release-${{ inputs.tag || format('source/{0}/{1}', inputs.project, inputs.version) }}
  cancel-in-progress: false

env:
  GOWORK: "off"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      project: ${{ steps.resolve.outputs.project }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      go-version: ${{ steps.setup-go.outputs.go-version }}
    steps:
      - name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          sparse-checkout: .github/scripts/release
          persist-credentials: false

      # The inputs are untrusted text, so they reach the script through the
      # environment and are matched before anything uses them as a ref or a
      # path. `mode` is required of a caller and absent from a dispatch, which
      # is how the two are told apart: in a called workflow `github.event_name`
      # is the caller's event.
      - name: The inputs name a release
        id: resolve
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PROJECT: ${{ inputs.project }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: tooling/.github/scripts/release/release-project.sh resolve >> "$GITHUB_OUTPUT"

      # The full history and every branch, so that origin/main is there to
      # prove the commit is on it. Checking out a tag that does not exist fails
      # here, which is what stops a dispatch naming an unknown tag.
      - name: Check out the commit to release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          path: release
          fetch-depth: 0
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: release/source/${{ steps.resolve.outputs.project }}/go.mod
          cache: false

      # In mode `release` the tag must not exist yet; in mode `finish` it must,
      # at the commit checked out. Both judge the project alone: what another
      # project does with its siblings never blocks it.
      - name: The release is valid
        env:
          RELEASE_ROOT: release
          MODE: ${{ steps.resolve.outputs.mode }}
          PROJECT: ${{ steps.resolve.outputs.project }}
          VERSION: ${{ steps.resolve.outputs.version }}
          SHA: ${{ steps.resolve.outputs.sha }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == release ]]; then
            tooling/.github/scripts/release/release-project.sh validate "$PROJECT" "$VERSION" "$SHA"
          else
            tooling/.github/scripts/release/release-project.sh finish-check "$TAG"
          fi

      # The last step of this job: from here on the project's own code runs.
      - name: The project's suite passes
        env:
          RELEASE_ROOT: release
          PROJECT: ${{ steps.resolve.outputs.project }}
        run: tooling/.github/scripts/release/release-project.sh test "$PROJECT"

  tag:
    name: tag
    needs: verify
    if: needs.verify.outputs.mode == 'release' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Credentials persist so the tag can be pushed. The working tree holds the
      # release scripts alone, and the full history holds the commit to tag,
      # which verify proved is on main.
      - name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts/release
          fetch-depth: 0

      - name: Push the tag
        env:
          PROJECT: ${{ needs.verify.outputs.project }}
          VERSION: ${{ needs.verify.outputs.version }}
          SHA: ${{ needs.verify.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/release/release-project.sh tag "$PROJECT" "$VERSION" "$SHA" "$RUN_URL"

  announce:
    name: announce
    needs: [verify, tag]
    # `tag` is skipped in mode `finish`, where the tag already exists.
    if: >-
      !cancelled() && !inputs.dry_run
      && needs.verify.result == 'success'
      && (needs.tag.result == 'success' || needs.verify.outputs.mode == 'finish')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The full history holds the tag and the notes in its commit; the working
      # tree holds the release scripts alone.
      - name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts/release
          fetch-depth: 0
          persist-credentials: false

      # The toolchain verify installed from the project's go.mod. It runs
      # `go list -m` against the module proxy from the repository root, which
      # holds no go.mod, so nothing of the project is built.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.verify.outputs.go-version }}
          cache: false

      - name: The module proxy serves the version and the GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          .github/scripts/release/release-project.sh announce "$TAG"
          echo "Released [${TAG}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})" >> "$GITHUB_STEP_SUMMARY"
