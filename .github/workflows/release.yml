# release — validates and announces one project's release.
#
# A human pushes the tag; nothing else starts this. The tag is the decision and
# the only input: `source/<project>/vX.Y.Z` releases the Go module under
# `source/<project>` at that version, and no other project (ADR-0001). The tag
# is the publication — the Go module proxy serves a module from the tag itself,
# so there is no registry to upload to and no credential in this repository.
#
# Three jobs, and the seams between them are safety properties. `tag` reads the
# repository and decides whether this is a release at all, judging the tagged
# project alone: what another project does with its siblings never blocks it.
# `test` builds and runs the module's suite exactly as a consumer of the tag
# would, with go.mod and go.sum already tidy. `announce` asks the module proxy
# to fetch the version, which both makes it immediately resolvable and proves
# the tag is a valid module version, then creates the GitHub Release.
name: release

on:
  push:
    # A tag filter is a glob, not a regex: it is the coarse gate. `**` matches
    # across `/`, so a project at any depth under `source/` passes it. The `tag`
    # job below applies the real pattern and fails a tag that only looks like a
    # release.
    tags: ['source/**/v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

# One release at a time, and never cancel one in flight: a cancelled run leaves
# a version tagged but unannounced.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GOWORK: "off"

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.parse.outputs.project }}
      version: ${{ steps.parse.outputs.version }}
      module: ${{ steps.parse.outputs.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Everything that can fail without leaving anything half-released fails
      # here: a tag that is not a project version, a project that does not
      # exist or is nested in or around another module, a tag off the default
      # branch, and missing release notes. The GitHub Release body is a file a
      # human wrote and reviewed.
      - name: The tag is a project version and carries its notes
        id: parse
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^source/([a-z0-9-]+(/[a-z0-9-]+)*)/(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::${GITHUB_REF_NAME} is not source/<project>/vX.Y.Z"
            exit 1
          fi
          project="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[3]}"

          if [[ ! -f "source/${project}/go.mod" ]]; then
            echo "::error::source/${project}/go.mod does not exist"
            exit 1
          fi

          # A project is exactly one module. A go.mod in an enclosing directory
          # makes source/${project} a nested module of another project, and a
          # go.mod below it carves packages out of the module being released.
          parent="${project%/*}"
          while [[ "$parent" != "$project" && -n "$parent" ]]; do
            if [[ -f "source/${parent}/go.mod" ]]; then
              echo "::error::source/${project} is nested inside the module at source/${parent}; a project may not sit inside another project"
              exit 1
            fi
            [[ "$parent" == */* ]] || break
            parent="${parent%/*}"
          done
          nested="$(find "source/${project}" -mindepth 2 -name go.mod -print -quit)"
          if [[ -n "$nested" ]]; then
            echo "::error::source/${project} contains another module at ${nested%/go.mod}; a project may not contain another project"
            exit 1
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} does not point at a commit on main"
            exit 1
          fi

          notes="docs/release-notes/${project}/${version}.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::$notes is missing — write the notes for ${GITHUB_REF_NAME} before tagging"
            exit 1
          fi

          echo "project=${project}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "module=go.vipengele.org/${project}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/${{ steps.parse.outputs.project }}/go.mod
          cache: false

      # The tagged go.mod is what every consumer reads, and a pushed tag is
      # permanent (ADR-0006). A consumer ignores a replace, while a GOWORK=off
      # build here honours it, so no build catches a leftover one: this check
      # does. The go.mod replaces no sibling, requires every sibling at a
      # version tagged source/<sibling>/<version>, and declares the module path
      # the vanity Worker serves for the project (ADR-0004). Only the tagged
      # project is read, so a sibling under development elsewhere in the
      # repository does not block its release. A prerelease suffix fails, and
      # tags are listed with an unauthenticated `git ls-remote`, which answers
      # only while the repository is public.
      - name: The tagged go.mod is what a consumer gets
        env:
          PROJECT: ${{ steps.parse.outputs.project }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          prefix="go.vipengele.org/"
          gomod="source/${PROJECT}/go.mod"
          status=0

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${GITHUB_REF_NAME} carries a prerelease suffix; only source/<project>/vX.Y.Z is released"
            exit 1
          fi

          if ! json="$(go mod edit -json "$gomod" 2>&1)"; then
            echo "::error file=${gomod}::${gomod} does not parse: ${json//$'\n'/ }"
            exit 1
          fi

          want="${prefix}${PROJECT}"
          have="$(jq -r .Module.Path <<< "$json")"
          if [[ "$have" != "$want" ]]; then
            echo "::error file=${gomod}::module path is ${have}, expected ${want}"
            status=1
          fi

          while IFS=$'\x1f' read -r old oldv new newv; do
            if [[ "$old" == "$prefix"* ]]; then
              echo "::error file=${gomod}::replace of ${old}${oldv:+ $oldv} -> ${new}${newv:+ $newv}: a consumer of ${GITHUB_REF_NAME} ignores it; drop it (go mod edit -dropreplace=${old}) and require the sibling at a tagged release"
            else
              echo "::error file=${gomod}::replace of ${old}${oldv:+ $oldv} -> ${new}${newv:+ $newv}: only a sibling may be replaced, and a released go.mod replaces none"
            fi
            status=1
          done < <(jq -r '(.Replace // [])[] | [.Old.Path, (.Old.Version // ""), .New.Path, (.New.Version // "")] | join("\u001f")' <<< "$json")

          mapfile -t requires < <(jq -r '(.Require // [])[] | select(.Path | startswith("'"$prefix"'")) | "\(.Path) \(.Version)"' <<< "$json")
          if (( ${#requires[@]} > 0 )); then
            remote="https://github.com/${GITHUB_REPOSITORY}.git"
            if ! listing="$(git ls-remote --tags --refs "$remote" 2>/dev/null)"; then
              echo "::error::git ls-remote --tags ${remote} failed; the tag lookup is unauthenticated and needs a public repository"
              exit 1
            fi
            declare -A tags=()
            while read -r _ ref; do
              if [[ -n "$ref" ]]; then
                tags["${ref#refs/tags/}"]=1
              fi
            done <<< "$listing"

            for entry in "${requires[@]}"; do
              read -r path version <<< "$entry"
              sibling="${path#"$prefix"}"
              if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.*[0-9]{14}-[0-9a-f]{12}$ ]]; then
                echo "::error file=${gomod}::${path} is required at the pseudo-version ${version}; a released go.mod requires every sibling at a tagged release"
                status=1
              elif [[ -z "${tags["source/${sibling}/${version}"]:-}" ]]; then
                echo "::error file=${gomod}::${path} ${version} has no tag source/${sibling}/${version} in ${GITHUB_REPOSITORY}; release ${sibling} first, then require that tag"
                status=1
              fi
            done
          fi
          exit "$status"

  test:
    name: test
    needs: tag
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/${{ needs.tag.outputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/${{ needs.tag.outputs.project }}/go.mod
          cache: false
      # go mod tidy resolves every requirement through the module proxy, as a
      # consumer's build does. A go.mod or go.sum that tidy changes, or a
      # go.sum it creates, is not the module that was reviewed.
      - name: go.mod and go.sum are tidy
        env:
          PROJECT: ${{ needs.tag.outputs.project }}
        run: |
          set -euo pipefail
          go mod tidy
          if [[ -n "$(git status --porcelain -- go.mod go.sum)" ]]; then
            git --no-pager diff -- go.mod go.sum
            echo "::error file=source/${PROJECT}/go.mod::go mod tidy changes go.mod or go.sum of ${PROJECT}; the tagged module is not tidy"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -shuffle=on ./...

  announce:
    name: announce
    needs: [tag, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # Asking the proxy for the version makes it fetch the tag now, so the
      # first consumer does not wait for it, and proves the module path and the
      # tag agree. The proxy resolves go.vipengele.org/<project> through the
      # vanity Worker, which answers for a project once its go.mod is merged and
      # publish-vanity-modules has published the list (ADR-0004, ADR-0016). The
      # proxy can lag the push by a moment, hence the retries.
      - name: The module proxy serves the version
        env:
          MODULE: ${{ needs.tag.outputs.module }}
          VERSION: ${{ needs.tag.outputs.version }}
          GOPROXY: https://proxy.golang.org
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if go list -m "${MODULE}@${VERSION}"; then exit 0; fi
            echo "attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
          echo "::error::${MODULE}@${VERSION} is not resolvable through the module proxy. go.vipengele.org must answer for ${MODULE} before its tag is pushed. It answers once this project's go.mod is merged and publish-vanity-modules has published the list, so a failure means the list has not been published or the Worker is down: check that run, then re-run this workflow (ADR-0004, ADR-0016)"
          exit 1

      # A release is idempotent: re-running the workflow after a partial run
      # finishes the announcement instead of failing on what already exists.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ needs.tag.outputs.project }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          prerelease=()
          if [[ "$VERSION" == *-* || "$VERSION" == v0.* ]]; then prerelease=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${PROJECT} ${VERSION}" \
            --notes-file "docs/release-notes/${PROJECT}/${VERSION}.md" \
            "${prerelease[@]}"
