# deploy-vanity-worker — deploys tools/vanity-worker to Cloudflare.
#
# The Worker answers `go get` for go.vipengele.org/<path> (ADR-0004). Its module
# list is generated at build time from every source/**/go.mod, so a change that
# adds, moves or removes a project's go.mod redeploys it as much as a change to
# the Worker itself does.
#
# A push to main deploys main. `workflow_dispatch` deploys the ref it is given,
# which lets a branch be served before it merges; with no ref it deploys the
# ref the run was started from.
#
# The credentials are the repository secret CLOUDFLARE_API_TOKEN and the
# repository variable CLOUDFLARE_ACCOUNT_ID. Without both, the run logs a notice and
# succeeds without deploying, so a repository that has not configured Cloudflare sees a
# green run rather than a failure on every push to main.
name: deploy-vanity-worker

on:
  push:
    branches: [main]
    paths:
      - 'tools/vanity-worker/**'
      - 'source/**/go.mod'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy. Empty deploys the ref the run is started from.
        type: string
        required: false
        default: ''

permissions:
  contents: read

# One deploy at a time, and never cancel one in flight: the later run deploys
# afterwards, so the last one started is the one left serving.
concurrency:
  group: deploy-vanity-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/vanity-worker
    steps:
      # The token is tested for presence only and never printed. A step
      # cannot read `secrets` in its `if:`, so the answer is a step output.
      - name: Cloudflare credentials are configured
        id: credentials
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; the vanity Worker is not deployed"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credentials.outputs.present == 'true'
        with:
          # Empty on push, which checks out the commit that triggered the run.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.credentials.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/vanity-worker/package-lock.json

      # The credentials are absent from the environment of the install and
      # build steps and present only in the deploy step. The job shares one
      # runner and filesystem, so this narrows where the token is visible
      # without isolating the deploy from the installed dependencies; the
      # lockfile and exact version pins are what constrain those.
      - name: Install and build
        if: steps.credentials.outputs.present == 'true'
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Deploy
        if: steps.credentials.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
