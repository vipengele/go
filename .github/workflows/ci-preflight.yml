# ci-preflight — this file is yours.
#
# gt created it once and will never modify or delete it again.
#
# This stage decides which later stages run. Emit `false` for a stage to skip
# it; anything else — including nothing at all — runs it.
#
# Here both stages are skipped when no project under source/ is affected by the
# change (see .github/actions/changed-projects). Which projects to build, when
# some are, is decided again inside each stage.
name: ci-preflight

on:
  workflow_call:
    outputs:
      run-build:
        description: Set to "false" to skip the build stage.
        value: ${{ jobs.preflight.outputs.run-build }}
      run-test:
        description: Set to "false" to skip the test stage.
        value: ${{ jobs.preflight.outputs.run-test }}

permissions:
  contents: read

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      run-build: ${{ steps.decide.outputs.run-build }}
      run-test: ${{ steps.decide.outputs.run-test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff against the event's base needs that base in the clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Find the projects this change affects
        id: projects
        uses: ./.github/actions/changed-projects

      # A change that touches no project (docs, agentic instructions) has
      # nothing to build or test. Skipping is safe because a skipped stage still
      # passes the gate.
      - name: Decide which stages to run
        id: decide
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: |
          set -euo pipefail
          echo "affected projects: ${PROJECTS}"
          if [[ "$(jq 'length' <<< "$PROJECTS")" -eq 0 ]]; then
            echo "run-build=false" >> "$GITHUB_OUTPUT"
            echo "run-test=false" >> "$GITHUB_OUTPUT"
          fi
