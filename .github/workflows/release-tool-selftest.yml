# release-tool-selftest — a dry run of release-tool.yml against the fixture
# tool, checked as a consumer of the release would check it (ADR-0033).
#
# `dry-run` calls the reusable workflow on source/update/testdata/releasefixture:
# it tags HEAD locally as v0.0.0-dryrun, builds with the fixture's committed
# .goreleaser.yaml, signs checksums.txt with an ephemeral key and publishes
# nothing. `verify` downloads the artifact and runs releaseverify, which checks
# the assets with releasetest.Verify under the fixture's update.Config, the
# public key from the artifact and the dry-run tag. `actionlint` checks both
# workflow files.
#
# The paths are the workflow, this file, the fixture and its verifier, the
# package Verify lives in and the package that renders the committed config: a
# change to any of them can break a release without failing a unit test.
name: release-tool-selftest

on:
  pull_request:
    paths:
      - '.github/workflows/release-tool.yml'
      - '.github/workflows/release-tool-selftest.yml'
      - 'source/update/testdata/release*/**'
      - 'source/update/internal/releasetest/**'
      - 'source/update/goreleaser/**'

permissions: {}

# A newer push to the same pull request supersedes the run in flight.
concurrency:
  group: release-tool-selftest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # No secrets: a dry run signs with a key it makes for the run, and the
  # workflow skips `publish`.
  dry-run:
    name: dry-run
    permissions:
      contents: read
    uses: ./.github/workflows/release-tool.yml
    with:
      dry-run: true
      working-directory: source/update/testdata/releasefixture
      go-version-file: ../../go.mod

  verify:
    name: verify
    needs: dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOWORK: "off"
    steps:
      # The outputs are the tag and pre-release flag the workflow hands to
      # `publish` in a real release; v0.0.0-dryrun has a pre-release suffix.
      - name: The outputs name the dry-run tag as a pre-release
        env:
          TAG: ${{ needs.dry-run.outputs.tag }}
          PRERELEASE: ${{ needs.dry-run.outputs.prerelease }}
        run: |
          set -euo pipefail
          status=0
          if [[ "$TAG" != "v0.0.0-dryrun" ]]; then
            echo "::error::the tag output is '${TAG}', not v0.0.0-dryrun"
            status=1
          fi
          if [[ "$PRERELEASE" != "true" ]]; then
            echo "::error::the prerelease output is '${PRERELEASE}', not true, for ${TAG}"
            status=1
          fi
          exit "$status"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/update/go.mod
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: ${{ runner.temp }}/release-dist

      - name: The release verifies under the fixture's update.Config
        working-directory: source/update
        env:
          DIST: ${{ runner.temp }}/release-dist
          TAG: ${{ needs.dry-run.outputs.tag }}
        run: |
          set -euo pipefail
          go run ./testdata/releaseverify "${DIST}/dist" "${DIST}/minisign.pub" "$TAG"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release asset of rhysd/actionlint, checked against a pinned digest,
      # the one the release's own checksums file lists. It needs no Go
      # toolchain, and the same bytes run on every runner image. actionlint
      # runs shellcheck over each `run:` script, and the ubuntu-latest image
      # carries shellcheck on PATH.
      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p actionlint-bin
          tar -xzf "$archive" -C actionlint-bin actionlint
          echo "${RUNNER_TEMP}/actionlint-bin" >> "$GITHUB_PATH"

      - name: actionlint
        run: |
          set -euo pipefail
          command -v shellcheck
          actionlint -color \
            .github/workflows/release-tool.yml \
            .github/workflows/release-tool-selftest.yml
