# ci-test — this file is yours.
#
# gt created it once and will never modify or delete it again. Put this
# repository's test suite here; the orchestration around it stays gt's.
#
# lydite gates coverage on its own: it runs each `.lydite/components.yml`
# component's suite itself, instrumented, rather than reading a report this
# stage produced. This stage exists to be the required correctness gate —
# every affected project's suite has to pass — independent of that gate.
#
# Each project under source/ is its own Go module (ADR-0001), so the suite runs
# once per affected project, in that project's directory, with `GOWORK=off` so it
# resolves siblings as its go.mod names them: a directory `replace` while they
# are developed together, a released version in strict mode (ADR-0006).
#
# A project holding a `*_windows.go` or `*_windows_test.go` file also runs its
# suite on windows-latest (ADR-0030). Every other project's suite exercises no
# Windows-only code, so the Windows job is gated to the affected projects that
# hold one and skips when there are none.
#
# When daemon is affected, test-supervisor also runs its servicetest suite with
# SERVICETEST=1, which boots podman containers with systemd as PID 1. A failed
# job fails this workflow, and with it the test stage ci-gate checks.
name: ci-test

on:
  workflow_call:

permissions:
  contents: read
  packages: read

env:
  GOWORK: "off"

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
      windows-projects: ${{ steps.windows.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: projects
        uses: ./.github/actions/changed-projects
      # The affected projects with a `*_windows.go` or `*_windows_test.go` file
      # in any of their packages, as a JSON array. A project directory holds no
      # other go.mod (ADR-0004), so every file found belongs to that project.
      - id: windows
        name: detect projects with Windows files
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: |
          set -euo pipefail
          selected="[]"
          while IFS= read -r project; do
            [[ -n "$project" ]] || continue
            dir="source/${project}"
            if [[ -n "$(find "$dir" \( -name '*_windows.go' -o -name '*_windows_test.go' \) -not -path "${dir}/vendor/*" -print -quit)" ]]; then
              selected="$(jq -c --arg p "$project" '. + [$p]' <<<"$selected")"
            fi
          done < <(jq -r '.[]' <<<"$PROJECTS")
          echo "windows projects: ${selected}"
          echo "projects=${selected}" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.project }})
    needs: detect
    # An empty matrix is a workflow error, so a run with no affected project
    # skips the job instead.
    if: needs.detect.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.projects) }}
    defaults:
      run:
        working-directory: source/${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/${{ matrix.project }}/go.mod
          cache-dependency-path: source/${{ matrix.project }}/go.sum
      - run: go test -race -shuffle=on ./...

  test-windows:
    name: test-windows (${{ matrix.project }})
    needs: detect
    # An empty matrix is a workflow error, so a run with no affected project
    # holding a Windows file skips the job instead. A skipped job leaves this
    # workflow's result a success, so ci-gate passes it.
    if: needs.detect.outputs.windows-projects != '[]'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.windows-projects) }}
    defaults:
      run:
        shell: bash
        working-directory: source/${{ matrix.project }}
    # -race needs cgo; windows-latest ships the mingw gcc it builds with.
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/${{ matrix.project }}/go.mod
          cache-dependency-path: source/${{ matrix.project }}/go.sum
      - run: go test -race -shuffle=on ./...

  test-supervisor:
    name: test-supervisor
    needs: detect
    # contains() on an array matches whole elements, so only the daemon
    # project selects this job.
    if: contains(fromJSON(needs.detect.outputs.projects), 'daemon')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/daemon
    env:
      SERVICETEST: "1"
      # "podman" or "sudo podman", the two values servicetest accepts; the
      # steps below expand it as a command line. ubuntu-latest ships podman, so nothing is installed.
      # Rootless podman runs systemd in a container only where the runner
      # delegates a cgroup v2 subtree to its user; set "sudo podman" to run it
      # rootful instead.
      SERVICETEST_PODMAN: podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/daemon/go.mod
          cache-dependency-path: source/daemon/go.sum
      # Records the podman version, its cgroup version and manager and whether
      # it runs rootless, which decide whether systemd can boot in a container.
      - name: show podman
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # the command line is split on purpose
          $SERVICETEST_PODMAN version
          # shellcheck disable=SC2086
          $SERVICETEST_PODMAN info
      # go test exits 0 when the test is skipped or matched nothing, so the
      # log has to show the test passing.
      - name: test supervisor
        run: |
          set -euo pipefail
          go test -v -run '^TestSupervisor$' ./servicetest/ 2>&1 | tee supervisor.log
          if ! grep -q -- '--- PASS: TestSupervisor' supervisor.log; then
            echo "::error::TestSupervisor did not pass"
            exit 1
          fi
      - name: remove servicetest containers
        if: always()
        run: |
          set -uo pipefail
          # shellcheck disable=SC2086 # the command line is split on purpose
          $SERVICETEST_PODMAN ps -aq --filter label=servicetest | xargs -r $SERVICETEST_PODMAN rm -f
