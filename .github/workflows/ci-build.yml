# ci-build — this file is yours.
#
# gt created it once and will never modify or delete it again. Put this
# repository's build steps here; the orchestration around it stays gt's.
#
# Each project under source/ is its own Go module (ADR-0001), so the stage runs
# once per affected project, in that project's directory. A project the change
# does not reach is not built.
#
# `GOWORK=off` builds each module exactly as a consumer of its tag sees it: from
# its own go.mod and go.sum, with every sibling at the released version it
# requires (ADR-0002). go.work is a local-development convenience and never
# decides whether CI passes.
#
# Running the suite is ci-test's job. The lydite stage gates coverage
# separately, running each `.lydite/components.yml` component's suite itself.
#
# It is called by ci-orchestration.yml and must keep `workflow_call`, or the
# orchestrator loses the stage.
name: ci-build

on:
  workflow_call:

# A called workflow may only ever NARROW what its caller grants, never widen
# it — so this block is a ceiling on the whole stage, not a floor. A stage
# widened via pipeline.{ci,cd}.stage_permissions still has to declare the extra
# scope HERE too, or the caller offers it and this file declines it.
permissions:
  contents: read
  packages: read

env:
  GOWORK: "off"

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/verify-sibling-deps
      - id: projects
        uses: ./.github/actions/changed-projects

  build:
    name: build (${{ matrix.project }})
    needs: detect
    # An empty matrix is a workflow error, so a run with no affected project
    # skips the job instead.
    if: needs.detect.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.projects) }}
    defaults:
      run:
        working-directory: source/${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain is the `go` directive of the project's own go.mod.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/${{ matrix.project }}/go.mod
          cache-dependency-path: source/${{ matrix.project }}/go.sum
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::gofmt would change:"; echo "$unformatted"
            exit 1
          fi
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: source/${{ matrix.project }}
      - run: go vet ./...
      - run: go build ./...
