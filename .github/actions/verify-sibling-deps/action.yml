# verify-sibling-deps — every dependency between projects is a released version.
#
# A project is a directory under source/, at any depth, holding a go.mod; its
# identifier is that directory relative to source/ (`cli`, `cli/core`), and its
# module path is go.vipengele.org/<project> (ADR-0004). A require of a path with
# that prefix is a require of a sibling. A project directory
# contains no other go.mod: Go excludes a nested module from the parent's ./...,
# and a tag source/<outer>/vX.Y.Z would publish a module missing the inner tree.
#
# A project that requires another project's module (ADR-0002) must name a
# version the Go module proxy can serve: a tagged release, never a pseudo-version
# and never a `replace` that points at a sibling directory. A `replace` is a
# local-development device that go.work provides without touching go.mod, and
# one that reaches a published go.mod makes every consumer of the module fail to
# build. Each sibling version required must have the tag
# source/<sibling>/<version> in this repository.
#
# With `expect-tag` set (the release workflow), the check also confirms that the
# tag being released has the form source/<project>/vX.Y.Z and names a project.
name: verify-sibling-deps
description: Fail when a project requires a sibling by anything but a released version.

inputs:
  expect-tag:
    description: 'The tag being released, e.g. source/cli/core/v0.2.0. Empty outside a release.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        EXPECT_TAG: ${{ inputs.expect-tag }}
      run: |
        set -euo pipefail
        prefix="go.vipengele.org/"
        status=0

        mapfile -t gomods < <(find source -name go.mod -type f 2>/dev/null | sort)

        # A project directory must not contain another go.mod.
        for outer in "${gomods[@]}"; do
          for inner in "${gomods[@]}"; do
            if [[ "$inner" != "$outer" && "$inner" == "${outer%/go.mod}/"* ]]; then
              echo "::error file=${inner}::${inner} is inside the project directory of ${outer}; a project directory must not contain another go.mod"
              status=1
            fi
          done
        done

        for gomod in "${gomods[@]}"; do
          project="${gomod#source/}"
          project="${project%/go.mod}"
          json="$(go mod edit -json "$gomod")"

          want="${prefix}${project}"
          have="$(jq -r .Module.Path <<< "$json")"
          if [[ "$have" != "$want" ]]; then
            echo "::error file=${gomod}::module path is ${have}, expected ${want}"
            status=1
          fi

          while read -r path target; do
            echo "::error file=${gomod}::replace of ${path} -> ${target}: a sibling is reached through go.work, not a replace"
            status=1
          done < <(jq -r '(.Replace // [])[] | select(.Old.Path | startswith("'"$prefix"'")) | "\(.Old.Path) \(.New.Path)"' <<< "$json")

          while read -r path version; do
            sibling="${path#"$prefix"}"
            if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.*[0-9]{14}-[0-9a-f]{12}$ ]]; then
              echo "::error file=${gomod}::${path} is required at the pseudo-version ${version}; require a tagged release"
              status=1
            elif ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/source/${sibling}/${version}" >/dev/null 2>&1; then
              echo "::error file=${gomod}::${path} ${version} has no tag source/${sibling}/${version} in ${GITHUB_REPOSITORY}"
              status=1
            fi
          done < <(jq -r '(.Require // [])[] | select(.Path | startswith("'"$prefix"'")) | "\(.Path) \(.Version)"' <<< "$json")
        done

        # The tagged project's go.mod is checked after the nested check above,
        # which already fails a tag naming either member of a nested pair.
        if [[ -n "$EXPECT_TAG" ]]; then
          if [[ ! "$EXPECT_TAG" =~ ^source/([a-z0-9-]+(/[a-z0-9-]+)*)/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::${EXPECT_TAG} is not source/<project>/vX.Y.Z"
            status=1
          elif [[ ! -f "source/${BASH_REMATCH[1]}/go.mod" ]]; then
            echo "::error::${EXPECT_TAG} names a project with no source/${BASH_REMATCH[1]}/go.mod"
            status=1
          fi
        fi
        exit "$status"
