# verify-sibling-deps — a sibling is replaced by its own directory while it is
# developed, and required at a tagged release once the dependent's release is
# written (ADR-0006).
#
# A project is a directory under source/, at any depth, holding a go.mod; its
# identifier is that directory relative to source/ (`cli`, `cli/core`), and its
# module path is go.vipengele.org/<project> (ADR-0004). A module path with that
# prefix is a sibling. A project directory contains no other go.mod: Go excludes
# a nested module from the parent's ./..., and a tag source/<outer>/vX.Y.Z would
# publish a module missing the inner tree.
#
# Each project is in one of two modes, read from the repository's files and its
# tags and never from a diff, so every event answers the same:
#
# - Strict, while some docs/release-notes/<project>/v<version>.md has no tag
#   source/<project>/v<version>: the release is written and not yet tagged. The
#   go.mod replaces no sibling, and every sibling version it requires is tagged.
#   A consumer ignores a published replace, and a GOWORK=off build honours it,
#   so this check is what keeps a replace out of a tagged go.mod.
# - Development, otherwise. A sibling may be replaced by a path, resolved
#   against the go.mod's directory, that is exactly source/<sibling>, naming no
#   version on either side; its required version is then never looked up. A
#   sibling required without a replace has the tag source/<sibling>/<version>.
#
# In both modes a sibling at a pseudo-version fails, as does a replace of any
# module that is not a sibling. Tags are listed once with an unauthenticated
# `git ls-remote`, which answers only while the repository is public.
name: verify-sibling-deps
description: >-
  Fail when a project reaches a sibling by anything but a version-less replace of the
  sibling's own directory or a tagged release, or replaces a sibling or requires an untagged
  one while its release notes have no tag.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        prefix="go.vipengele.org/"
        remote="https://github.com/${GITHUB_REPOSITORY}.git"
        status=0

        # has_tag <tag> answers from a single listing of the remote's tags. A
        # listing that fails leaves every verdict unknown, so the check stops.
        declare -A tags=()
        tags_listed=0
        has_tag() {
          if (( tags_listed == 0 )); then
            local listing
            if ! listing="$(git ls-remote --tags --refs "$remote" 2>/dev/null)"; then
              echo "::error::git ls-remote --tags ${remote} failed; the tag lookup is unauthenticated and needs a public repository"
              exit 1
            fi
            while read -r _ ref; do
              if [[ -n "$ref" ]]; then
                tags["${ref#refs/tags/}"]=1
              fi
            done <<< "$listing"
            tags_listed=1
          fi
          [[ -n "${tags[$1]:-}" ]]
        }

        mapfile -t gomods < <(find source -name go.mod -type f 2>/dev/null | sort)

        # A project directory must not contain another go.mod.
        for outer in "${gomods[@]}"; do
          for inner in "${gomods[@]}"; do
            if [[ "$inner" != "$outer" && "$inner" == "${outer%/go.mod}/"* ]]; then
              echo "::error file=${inner}::${inner} is inside the project directory of ${outer}; a project directory must not contain another go.mod"
              status=1
            fi
          done
        done

        for gomod in "${gomods[@]}"; do
          project="${gomod#source/}"
          project="${project%/go.mod}"
          dir="${gomod%/go.mod}"
          # The Go command refuses a version on a directory replace target
          # (`=> ../commons v0.1.0`), so that replace fails here.
          if ! json="$(go mod edit -json "$gomod" 2>&1)"; then
            echo "::error file=${gomod}::${gomod} does not parse: ${json//$'\n'/ }"
            status=1
            continue
          fi

          want="${prefix}${project}"
          have="$(jq -r .Module.Path <<< "$json")"
          if [[ "$have" != "$want" ]]; then
            echo "::error file=${gomod}::module path is ${have}, expected ${want}"
            status=1
          fi

          # Strict while any version with release notes has no tag. Notes of a
          # nested project sit in their own subdirectory, so only files directly
          # in the project's notes directory count.
          untagged=()
          notes="docs/release-notes/${project}"
          if [[ -d "$notes" ]]; then
            while IFS= read -r note; do
              version="$(basename "$note" .md)"
              if ! has_tag "source/${project}/${version}"; then
                untagged+=("$version")
              fi
            done < <(find "$notes" -mindepth 1 -maxdepth 1 -type f -name 'v*.md' | sort)
          fi
          strict=0
          if (( ${#untagged[@]} > 0 )); then
            strict=1
            echo "::notice file=${gomod}::${project} is in strict mode: release notes ${untagged[*]} have no tag under source/${project}/, so its go.mod replaces no sibling and requires only tagged sibling versions"
          fi

          declare -A replaced=()
          while IFS=$'\x1f' read -r old oldv new newv; do
            if [[ "$old" != "$prefix"* ]]; then
              echo "::error file=${gomod}::replace of ${old} -> ${new}${newv:+ $newv}: only a sibling may be replaced, and only by its own project directory"
              status=1
              continue
            fi
            sibling="${old#"$prefix"}"
            replaced["$old"]=1
            if (( strict )); then
              echo "::error file=${gomod}::replace of ${old} -> ${new}${newv:+ $newv}: ${project} is in strict mode (release notes ${untagged[*]} have no tag), so it requires the sibling at a tagged release with no replace"
              status=1
              continue
            fi
            if [[ -n "$oldv" || -n "$newv" ]]; then
              echo "::error file=${gomod}::replace of ${old}${oldv:+ $oldv} -> ${new}${newv:+ $newv} names a version; a sibling is replaced by its project directory alone"
              status=1
              continue
            fi
            if [[ "$new" == /* ]]; then
              target="$(realpath -m --relative-to=. -- "$new")"
            else
              target="$(realpath -m --relative-to=. -- "${dir}/${new}")"
            fi
            own="$(realpath -m --relative-to=. -- "source/${sibling}")"
            if [[ ! -f "source/${sibling}/go.mod" || "$target" != "$own" ]]; then
              echo "::error file=${gomod}::replace of ${old} -> ${new} resolves to ${target}; a sibling is replaced only by its own project directory source/${sibling}"
              status=1
            fi
          done < <(jq -r '(.Replace // [])[] | [.Old.Path, (.Old.Version // ""), .New.Path, (.New.Version // "")] | join("\u001f")' <<< "$json")

          while read -r path version; do
            sibling="${path#"$prefix"}"
            if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.*[0-9]{14}-[0-9a-f]{12}$ ]]; then
              echo "::error file=${gomod}::${path} is required at the pseudo-version ${version}; require a tagged release, or replace the sibling by its project directory"
              status=1
            elif (( strict )) || [[ -z "${replaced[$path]:-}" ]]; then
              if ! has_tag "source/${sibling}/${version}"; then
                if (( strict )); then
                  echo "::error file=${gomod}::${path} ${version} has no tag source/${sibling}/${version} in ${GITHUB_REPOSITORY}; ${project} is in strict mode, so every sibling it requires is a tagged release"
                else
                  echo "::error file=${gomod}::${path} ${version} has no tag source/${sibling}/${version} in ${GITHUB_REPOSITORY}; require a tagged release, or replace the sibling by its project directory"
                fi
                status=1
              fi
            fi
          done < <(jq -r '(.Require // [])[] | select(.Path | startswith("'"$prefix"'")) | "\(.Path) \(.Version)"' <<< "$json")
          unset replaced
        done

        exit "$status"
