# verify-sibling-deps — a sibling is replaced by its own directory while it is
# developed, and required at a tagged or pending release once the dependent's
# release is written (ADR-0006).
#
# A project is a directory under source/, at any depth, holding a go.mod; its
# identifier is that directory relative to source/ (`cli`, `cli/core`), and its
# module path is go.vipengele.org/<project> (ADR-0004). A module path with that
# prefix is a sibling. A project directory contains no other go.mod: Go excludes
# a nested module from the parent's ./..., and a tag source/<outer>/vX.Y.Z would
# publish a module missing the inner tree.
#
# Each project is in one of two modes, read from the repository's files and its
# tags and never from a diff, so every event answers the same:
#
# - Strict, while some docs/release-notes/<project>/v<version>.md has no tag
#   source/<project>/v<version>: the release is written and not yet tagged. A
#   sibling may be replaced as in development mode, and it is then required at
#   its pending version, whose notes exist and whose tag does not, or at a
#   tagged one; the release commit drops the replace and requires that version,
#   so a tagged go.mod carries no replace. Every sibling required without a
#   replace is tagged.
# - Development, otherwise. A replaced sibling's required version is never
#   looked up, and a sibling required without a replace has the tag
#   source/<sibling>/<version>.
#
# In both modes a sibling may be replaced only by a path, resolved against the
# go.mod's directory, that is exactly source/<sibling>, naming no version on
# either side. A sibling at a pseudo-version fails, as does a replace of any
# module that is not a sibling. Tags are listed once with an unauthenticated
# `git ls-remote`, which answers only while the repository is public. The
# check is verify.sh; .github/scripts/release/test/run.sh tests it.
name: verify-sibling-deps
description: >-
  Fail when a project reaches a sibling by anything but a version-less replace of the
  sibling's own directory or a tagged release, or, while its release notes have no tag,
  requires a replaced sibling at a version neither pending nor tagged or an unreplaced one
  at an untagged version.

runs:
  using: composite
  steps:
    - shell: bash
      run: '"${GITHUB_ACTION_PATH}/verify.sh" . "https://github.com/${GITHUB_REPOSITORY}.git"'
