# changed-projects — the projects under source/ whose CI has something to check.
#
# A project is a directory under source/, at any depth, holding a go.mod
# (ADR-0001, ADR-0004). Its identifier is its path relative to source/, so
# source/cli is `cli` and source/spike/probe is `spike/probe`; the workflows run
# in source/<identifier>. A changed file belongs to the project whose directory
# is its longest prefix — source/spike/probe/x is `spike/probe`, never a project
# at source/spike — and a file under source/ inside no project selects nothing.
#
# A project directory contains no other go.mod: source/cli and source/cli/core
# cannot both be projects. Go excludes a nested module from the enclosing
# module's ./..., while the longest-prefix rule above gives the nested
# directory's files to the nested project alone, so the two would be selected
# and checked inconsistently. The action fails on any such pair before it
# selects anything, whether or not the diff base is known.
#
# A project is also selected when its go.mod requires, directly or
# transitively, a module owned by a selected project (ADR-0006): a change
# reaches every project that consumes it. A require of go.vipengele.org/<path>
# (the project's module path, ADR-0004) is owned by the project whose identifier
# is the longest prefix of <path>, so a major-version suffix (`cli/v2`) resolves
# to `cli`. Every such require is a cross-project edge.
#
# A change to a file every project's CI depends on (the CI stages, this action,
# the coverage config) selects all of them, since those can alter any project's
# result. Anything else — docs, agentic instructions — selects none.
#
# The diff is against the base of the event: the PR base, the merge-group base or
# the pushed range. When no base can be determined (a manual run, a first push, a
# base commit the clone lacks) every project is selected: an unknown diff must not
# skip a project. The caller checks out with `fetch-depth: 0` so the base exists.
name: changed-projects
description: JSON array of the source/ projects a change affects.

outputs:
  projects:
    description: 'JSON array of project paths relative to source/, e.g. ["cli", "spike/probe"].'
    value: ${{ steps.detect.outputs.projects }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        MERGE_BASE: ${{ github.event.merge_group.base_sha }}
        PUSH_BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail

        mapfile -t gomods < <(find source -name go.mod -type f 2>/dev/null | sort)
        if ((${#gomods[@]} == 0)); then
          echo "no project under source/ yet"
          echo "projects=[]" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # A project directory must not contain another go.mod.
        nested=0
        for outer in "${gomods[@]}"; do
          for inner in "${gomods[@]}"; do
            if [[ "$inner" != "$outer" && "$inner" == "${outer%/go.mod}/"* ]]; then
              echo "::error file=${inner}::${inner} is inside the project directory of ${outer}; a project directory must not contain another go.mod (Go excludes a nested module from the parent's ./..., so the two projects would be selected inconsistently)"
              nested=1
            fi
          done
        done
        if ((nested)); then
          exit 1
        fi

        all="$(printf '%s\n' "${gomods[@]}" | sed -e 's|^source/||' -e 's|/go\.mod$||' | sort -u | jq -R . | jq -sc .)"

        case "$EVENT" in
          pull_request*) base="$PR_BASE" ;;
          merge_group)   base="$MERGE_BASE" ;;
          push)          base="$PUSH_BEFORE" ;;
          *)             base="" ;;
        esac

        # An all-zero SHA is what a push that creates a branch reports.
        if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
          echo "no usable base for ${EVENT}; selecting every project"
          echo "projects=${all}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        changed="$(git diff --name-only "$base" HEAD)"
        echo "changed files:"; echo "$changed" | sed 's/^/  /'

        if grep -qE '^(\.github/(workflows/ci-[a-z]+\.yml|actions/)|\.lydite/)' <<< "$changed"; then
          echo "a shared CI file changed; selecting every project"
          echo "projects=${all}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # owner($path): the project whose identifier is the longest prefix of
        # $path at a `/` boundary, or null. Only existing projects are
        # candidates, so a file of a project directory that no longer exists
        # selects nothing.
        owner='def owner($path):
          [$all[] as $p | select($path == $p or ($path | startswith($p + "/"))) | $p]
          | max_by(length);'

        selected="$(grep -E '^source/' <<< "$changed" | jq -R . | jq -sc --argjson all "$all" "${owner}"'
          [.[] | ltrimstr("source/") as $f | owner($f) | select(. != null)] | unique' || true)"
        selected="${selected:-[]}"

        # A require of go.vipengele.org/<path> is a cross-project edge to the
        # project owning <path> (ADR-0006, ADR-0004); the closure selects every
        # consumer of a selected project.
        edges="$(for gomod in "${gomods[@]}"; do
          project="$(sed -e 's|^source/||' -e 's|/go\.mod$||' <<< "$gomod")"
          go mod edit -json "$gomod" | jq -c --arg project "$project" --argjson all "$all" "${owner}"'
            {project: $project,
             deps: [(.Require // [])[].Path
                    | select(startswith("go.vipengele.org/"))
                    | owner(ltrimstr("go.vipengele.org/"))
                    | select(. != null)] | unique}'
        done | jq -sc .)"

        selected="$(jq -nc --argjson selected "$selected" --argjson edges "$edges" '
          def dependents($p):
            [$edges[] | select(.project != $p) | select(any(.deps[]; . == $p)) | .project] | unique;

          def closure:
            . as $set
            | ($set + [$set[] as $p | dependents($p)[]] | unique) as $next
            | if $next == $set then $set else $next | closure end;

          $selected | unique | closure')"
        echo "projects=${selected}" >> "$GITHUB_OUTPUT"
